name: integrity
# Enforces integrity: no unresolved conflict markers, a canonical root, every sheet headed by its path.
# It does not enforce no-deletion, and must not. The owner, 2026-09-07, quoted as written: "we cant enforce
# integroty by ebforceing no deletion. we can only imply no deletion to enforcer integiortyty". A deletion is
# preceded by its enumeration in the record at L8/L6/history/; git keeps the change event.
on: [push, pull_request]
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unresolved conflict markers (G-001)
        run: |
          ! grep -rnE '^<{7}( |$)|^={7}$|^>{7}( |$)' . --exclude-dir=.git -I

      - name: The root is canonical (G-002)
        run: |
          # The root holds README.md, L7/, L8/, .github/, and .gitignore, and nothing else.
          # Every 7LM repository has the same root; the interior layers are uppercase L0-L6.
          fail=0
          for e in $(git ls-tree --name-only HEAD); do
            case "$e" in README.md|L7|L8|.github|.gitignore) ;; *) echo "not canonical at root: $e"; fail=1;; esac
          done
          git ls-tree --name-only HEAD | grep -qx 'README.md' || { echo "missing README.md"; fail=1; }
          git ls-tree --name-only HEAD | grep -qx 'L7' || { echo "missing L7/"; fail=1; }
          git ls-tree --name-only HEAD | grep -qx 'L8' || { echo "missing L8/"; fail=1; }
          exit $fail

      - name: Every sheet is headed by its path, and every canonical position has a sheet (G-003)
        run: |
          # A sheet is a 0.md whose first line is "# <path>/". Retired sets under L6/retired/ keep their prior
          # sheets verbatim and are not checked below their own root. The canonical positions are the
          # specification's tree; material filed beneath them may carry sheets or not (reported in the next step).
          fail=0; checked=0
          top=L8
          for s in $(git ls-files | grep -E "^(L7|$top)(/.*)?/0\.md$"); do
            d=${s%/0.md}
            case "$d" in */L6/retired/*/*) continue;; esac
            checked=$((checked+1))
            first=$(head -n 1 "$s")
            [ "$first" = "# $d/" ] || { echo "heading is not the path: $s -> $first"; fail=1; }
          done
          echo "sheets checked: $checked"
          canon="L7 L7/provenance L7/provenance/prior-art L7/provenance/sources L7/provenance/lineage L7/provenance/authority
                 L7/governance L7/governance/copyright L7/governance/licensing L7/governance/patents L7/governance/permissions L7/governance/access L7/governance/controlled
                 L7/peering L7/peering/private L7/peering/private/ingress L7/peering/private/egress L7/peering/public L7/peering/public/ingress L7/peering/public/egress
                 L7/peering/private/ingress/peer-1 L7/peering/private/ingress/peer-1/object-1 L7/peering/private/egress/peer-1 L7/peering/private/egress/peer-1/object-1 L7/peering/public/ingress/peer-1 L7/peering/public/ingress/peer-1/object-1 L7/peering/public/egress/peer-1 L7/peering/public/egress/peer-1/object-1
                 L7/allications L7/allications/publications L7/allications/applications L7/allications/communications L7/allications/specifications L7/allications/notifications L7/allications/participations
                 $top $top/L6 $top/L6/history $top/L6/retired
                 $top/L5 $top/L5/research $top/L5/research/lanes $top/L5/research/review $top/L5/research/findings
                 $top/L5/institution $top/L5/institution/peers $top/L5/institution/undergraduates
                 $top/L4 $top/L4/work $top/L4/work/writing $top/L4/work/experiments $top/L4/work/computation
                 $top/L3 $top/L3/engineering-mathematics $top/L3/engineering-mathematics/approximation $top/L3/engineering-mathematics/uncertainty $top/L3/engineering-mathematics/tolerances
                 $top/L2 $top/L2/formal-mathematics $top/L2/formal-mathematics/relations $top/L2/formal-mathematics/operators $top/L2/formal-mathematics/proofs
                 $top/L1 $top/L1/state-space
                 $top/L0 $top/L0/universality $top/L0/pedagogy $top/L0/epistemic $top/L0/ontology $top/L0/semantics $top/L0/semantics/definitions"
          for d in $canon; do [ -f "$d/0.md" ] || { echo "canonical position without a sheet: $d/0.md"; fail=1; }; done
          exit $fail

      - name: Report directories without a sheet (not a failure)
        run: |
          top=L8
          for d in $(git ls-tree -r -d --name-only HEAD -- L7 "$top"); do
            case "$d" in */L6/retired/*/*) continue;; esac
            [ -f "$d/0.md" ] || echo "::notice::no sheet: $d/"
          done
