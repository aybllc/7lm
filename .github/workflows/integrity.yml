name: integrity

# Structural integrity checks for the current 7LM repository.
# Passing this workflow means only that the checked repository structure is internally consistent.
# It does not establish architectural completeness, scientific validity, reproducibility, or peer review.

on: [push, pull_request]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unresolved conflict markers (G-001)
        shell: bash
        run: |
          set +e
          grep -rnI -E '^(<{7}|={7}|>{7}|\|{7})( |$)' . --exclude-dir=.git
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "unresolved conflict marker found"
            exit 1
          fi
          if [ "$rc" -gt 1 ]; then
            echo "conflict-marker scan failed with status $rc"
            exit "$rc"
          fi

      - name: The root is canonical (G-002)
        shell: bash
        run: |
          fail=0
          count=0

          while IFS= read -r -d '' e; do
            count=$((count + 1))
            case "$e" in
              README.md|L7|L8|.github) ;;
              *)
                echo "not canonical at root: $e"
                fail=1
                ;;
            esac
          done < <(git ls-tree -z --name-only HEAD)

          [ "$count" -eq 4 ] || {
            echo "canonical root must contain exactly README.md, L7/, L8/, and .github/ (found $count entries)"
            fail=1
          }

          for required in README.md L7 L8 .github; do
            git ls-tree --name-only HEAD | grep -Fxq "$required" || {
              echo "missing root entry: $required"
              fail=1
            }
          done

          exit "$fail"

      - name: Current sheets have the correct path heading and a semantic body (G-003)
        shell: bash
        run: |
          fail=0
          checked=0

          while IFS= read -r -d '' s; do
            case "$s" in
              L7/0.md|L7/*/0.md|L8/0.md|L8/*/0.md) ;;
              *) continue ;;
            esac

            d=${s%/0.md}

            # Retired sets preserve historical sheets verbatim. Check the retired
            # set root, but do not reinterpret nested historical sheets as current.
            case "$d" in
              */L6/retired/*/*) continue ;;
            esac

            checked=$((checked + 1))
            first=$(head -n 1 "$s")
            if [ "$first" != "# $d/" ]; then
              echo "heading is not the path: $s -> $first"
              fail=1
            fi

            # Structural proxy only: a current sheet must contain semantic content
            # beyond its heading. CI cannot judge whether that content is correct.
            if ! tail -n +2 "$s" | grep -q '[^[:space:]]'; then
              echo "current sheet has no semantic body: $s"
              fail=1
            fi
          done < <(git ls-files -z)

          echo "current sheets checked: $checked"

          canon="L7
          L7/provenance
          L7/provenance/prior-art
          L7/provenance/sources
          L7/provenance/lineage
          L7/provenance/authority
          L7/governance
          L7/governance/copyright
          L7/governance/licensing
          L7/governance/patents
          L7/governance/permissions
          L7/governance/access
          L7/governance/controlled
          L7/peering
          L7/peering/private
          L7/peering/private/ingress
          L7/peering/private/egress
          L7/peering/public
          L7/peering/public/ingress
          L7/peering/public/egress
          L7/peering/private/ingress/peer-1
          L7/peering/private/ingress/peer-1/object-1
          L7/peering/private/egress/peer-1
          L7/peering/private/egress/peer-1/object-1
          L7/peering/public/ingress/peer-1
          L7/peering/public/ingress/peer-1/object-1
          L7/peering/public/egress/peer-1
          L7/peering/public/egress/peer-1/object-1
          L7/allications
          L7/allications/publications
          L7/allications/applications
          L7/allications/communications
          L7/allications/specifications
          L7/allications/notifications
          L7/allications/participations
          L8
          L8/L6
          L8/L6/history
          L8/L6/retired
          L8/L5
          L8/L5/research
          L8/L5/research/lanes
          L8/L5/research/review
          L8/L5/research/findings
          L8/L5/institution
          L8/L5/institution/peers
          L8/L5/institution/undergraduates
          L8/L4
          L8/L4/work
          L8/L4/work/writing
          L8/L4/work/experiments
          L8/L4/work/computation
          L8/L3
          L8/L3/engineering-mathematics
          L8/L3/engineering-mathematics/approximation
          L8/L3/engineering-mathematics/uncertainty
          L8/L3/engineering-mathematics/tolerances
          L8/L2
          L8/L2/formal-mathematics
          L8/L2/formal-mathematics/relations
          L8/L2/formal-mathematics/operators
          L8/L2/formal-mathematics/proofs
          L8/L1
          L8/L1/state-space
          L8/L0
          L8/L0/universality
          L8/L0/pedagogy
          L8/L0/epistemic
          L8/L0/ontology
          L8/L0/semantics
          L8/L0/semantics/definitions"

          while IFS= read -r d; do
            [ -n "$d" ] || continue
            if [ ! -f "$d/0.md" ]; then
              echo "canonical position without a sheet: $d/0.md"
              fail=1
            fi
          done <<< "$canon"

          exit "$fail"

      - name: Report noncanonical directories without a sheet (G-004)
        shell: bash
        run: |
          while IFS= read -r -d '' d; do
            case "$d" in
              */L6/retired/*/*) continue ;;
            esac
            [ -f "$d/0.md" ] || echo "::notice::no sheet: $d/"
          done < <(git ls-tree -r -d -z --name-only HEAD -- L7 L8)
